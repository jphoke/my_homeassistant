substitutions:
  name: basement-air-sensor
  friendly_name: BasementAirSensor
packages:
  ApolloAutomation.AIR-1: github://ApolloAutomation/AIR-1/Integrations/ESPHome/AIR-1.yaml
esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}
api:
  encryption:
    key: !secret api_key


wifi:
  ssid: !secret wifi_ssid2
  password: !secret wifi_password

# Add BT Proxy functionality
esp32_ble_tracker:
  scan_parameters:
    interval: 1100ms
    window: 1100ms
    active: true

bluetooth_proxy:
  active: True

sensor:
  - id: !extend sen55
    update_interval: 60s
  - id: !extend pm0_3_to_1
    update_interval: 60s
  - id: !extend pm1_to_2_5
    update_interval: 60s
  - id: !extend pm2_5_to_4
    update_interval: 60s
  - id: !extend pm4_to_10
    update_interval: 60s